plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cl.ccu.tiempos'
    compileSdk 34

    defaultConfig {
        applicationId "cl.ccu.tiempos"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "4.14"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
